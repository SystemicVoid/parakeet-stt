<!doctype html>
<!-- PROTOTYPE (throwaway). Five variants of the session Overlay, switchable via ?variant=a..e,
     rendered over a mocked desktop. Run: `just overlay-proto` then open the printed URL. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overlay look prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #202020; font-family: system-ui, sans-serif; }
  #backdrop { position: fixed; inset: 0; z-index: 0; }
  #overlay-root { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #proto-bar {
    position: fixed; top: 44px; left: 50%; transform: translateX(-50%); z-index: 100;
    display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
    background: #ffd400; color: #111; font: 12px/1 ui-monospace, monospace; box-shadow: 0 4px 16px rgba(0,0,0,.45);
    white-space: nowrap;
  }
  #proto-bar button { font: inherit; border: 0; border-radius: 999px; padding: 5px 9px; background: #111; color: #ffd400; cursor: pointer; }
  #proto-bar button:hover { background: #333; }
  #proto-bar .label { font-weight: 700; min-width: 140px; text-align: center; }
  #proto-bar .sep { width: 1px; height: 18px; background: rgba(0,0,0,.3); margin: 0 4px; }
  #proto-bar .hint { opacity: .75; }
  #proto-bar .hint kbd { border: 1px solid #111; border-radius: 3px; padding: 0 3px; }
  #proto-bar .state { opacity: .8; min-width: 300px; }

  /* --- mocked desktop scenes --- */
  .backdrop .panel { position: absolute; top: 0; left: 0; right: 0; height: 28px; background: #1b1b1b; color: #ddd; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .backdrop .caret { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .backdrop-terminal { background: #0c0d10; }
  .backdrop-terminal .term { position: absolute; top: 28px; left: 0; right: 0; bottom: 0; padding: 22px 28px; color: #c9d1d9; font: 15px/1.55 ui-monospace, "Fira Code", monospace; }
  .backdrop-terminal pre { margin: 0; white-space: pre-wrap; }

  .backdrop-docs { background: #ececef; }
  .backdrop-docs .doc { position: absolute; top: 28px; left: 50%; transform: translateX(-50%); width: min(860px, 80vw); height: calc(100% - 28px); background: #fff; padding: 56px 72px; box-sizing: border-box; color: #222; font: 17px/1.6 Georgia, "Noto Serif", serif; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
  .backdrop-docs h1 { font-size: 30px; margin: 0 0 18px; }
  .backdrop-docs h2 { font-size: 20px; margin: 24px 0 8px; }
  .backdrop-docs .field { margin-top: 36px; padding: 12px 14px; border: 1px solid #c8c8cc; border-radius: 6px; color: #888; }

  .backdrop-chat { background: #f4f4f6; }
  .backdrop-chat .chat { position: absolute; top: 28px; left: 0; right: 0; bottom: 0; display: flex; color: #222; font: 14px/1.5 system-ui, sans-serif; }
  .backdrop-chat aside { width: 240px; background: #1e1f24; color: #cfd0d6; padding: 18px 12px; }
  .backdrop-chat .brand { font-weight: 700; margin-bottom: 14px; color: #fff; }
  .backdrop-chat .item { padding: 8px 10px; border-radius: 6px; }
  .backdrop-chat .item.active { background: #2f3138; color: #fff; }
  .backdrop-chat main { flex: 1; position: relative; padding: 32px 0 120px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .backdrop-chat .msg { max-width: 640px; width: 100%; padding: 12px 16px; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .backdrop-chat .msg.me { background: #dfe8ff; }
  .backdrop-chat .composer { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); width: min(720px, 80%); height: 88px; background: #fff; border-radius: 14px; border: 1px solid #d6d6dc; padding: 14px 16px; box-sizing: border-box; color: #999; }
  .backdrop-chat code { background: #eef; padding: 0 4px; border-radius: 3px; }
</style>
</head>
<body>
  <div id="backdrop" class="backdrop backdrop-chat"></div>
  <div id="overlay-root"></div>
  <div id="proto-bar"></div>

  <script src="_harness.js"></script>
  <script src="variant-a.js"></script>
  <script src="variant-b.js"></script>
  <script src="variant-c.js"></script>
  <script src="variant-d.js"></script>
  <script src="variant-e.js"></script>
  <script src="variant-f.js"></script>
  <script src="variant-z-baseline.js"></script>
</body>
</html>
